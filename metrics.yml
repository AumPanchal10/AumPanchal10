name: Metrics cards

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Needs a classic personal access token saved as the repo secret METRICS_TOKEN
      # (scopes: public_repo, read:user). See https://github.com/lowlighter/metrics
      - name: Overview card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: assets/metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage

      - name: LeetCode card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: assets/leetcode.svg
          template: classic
          base: ""
          config_timezone: Asia/Kolkata
          plugin_leetcode: yes
          plugin_leetcode_user: aumpanchal
