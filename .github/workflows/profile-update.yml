name: Update Profile README

on:
  schedule:
    - cron: "0 3 * * 1"
  push:
    branches: [main]
    paths:
      - "config/**"
      - "scripts/generate_readme.py"
      - "scripts/validate_profile.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-readme-updates
  cancel-in-progress: false

jobs:
  update-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate profile configuration
        run: python scripts/validate_profile.py
      - name: Render README from configuration
        run: python scripts/generate_readme.py
      - name: Refresh recent public repositories
        run: python scripts/update_recent_repos.py
        env:
          GH_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh profile README"
            git pull --rebase
            git push
          fi
