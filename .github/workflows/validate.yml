name: Validate Profile & Assets

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: python -m py_compile scripts/utils.py scripts/validate_profile.py scripts/generate_readme.py scripts/generate_stats.py scripts/update_recent_repos.py
      - name: Validate JSON configs and SVG XML
        run: python scripts/validate_profile.py
      - name: Verify README is synchronized with config
        run: python scripts/generate_readme.py --check
