name: Refresh GitHub profile README

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * 1" # Every Monday at 03:30 UTC
  push:
    paths:
      - "profile.json"
      - "scripts/generate_readme.py"
      - ".github/recent-repositories.json"
      - ".github/workflows/update-profile-readme.yml"

permissions:
  contents: write

jobs:
  refresh-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh public repository activity and generate README
        run: python scripts/generate_readme.py --refresh-github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit generated README when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/recent-repositories.json
          if git diff --cached --quiet; then
            echo "No README changes to commit."
          else
            git commit -m "chore: refresh profile README"
            git push
          fi
